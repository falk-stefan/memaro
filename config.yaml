#
# Memaro product-focused configuration (minimal, search-first)
#

tools:

  search_memories:
    description: |
      MANDATORY FIRST STEP.
      For every new request or session, you must search for existing memories before doing anything else.
      Do not proceed without calling this tool.
      Goal: reuse prior knowledge about the product, its purpose, and direction.

      If results are missing, unclear, or insufficient:
      - ask the user for product context before proceeding

  add_memory:
    description: |
      Always store new knowledge after each interaction.

      PRIORITY:
      - WHAT we are building (features, product scope, user value)
      - WHY it exists (user problems, motivations, goals)

      AVOID:
      - low-level technical details
      - implementation specifics unless they explain the WHY

      Store only clear, reusable product insights.
      Keep it concise and high-signal.

  update_memory:
    description: |
      Update memories when the product direction, goals, or assumptions change.
      Prefer updating over creating duplicates.
      Ensure the "WHAT" and "WHY" stay accurate.

  link_memory:
    description: |
      Link related product insights when one explains or justifies another.
      Focus on connecting:
      - features → user problems
      - decisions → motivations

  search_tags:
    description: |
      Always search for existing tags before creating new ones.
      Prefer simple, product-oriented tags.

  add_tag:
    description: |
      Only create tags if necessary.
      Tags must reflect product meaning (e.g. "onboarding", "pricing", "target-user").

  get_memory:
    description: |
      Retrieve a memory by its ID.

  read_instructions:
    description: |
      MANDATORY FIRST STEP before writing code, reviewing code, or acting in
      a defined role (e.g. reviewer, PM). Retrieves the house rules and
      conventions that apply — do not guess at conventions that were never
      provided; call this instead.

      Usage:
      - read_instructions({ context: "how should I write code comments" })
        for a free-text question — returns the most relevant instruction
        content, ranked.
      - read_instructions({ tags: ["coding", "react"] }) to pull everything
        tagged with any of the given tags.
      - Add { mode: "short" } to either form to get a short list of what
        exists (title + tags) instead of full content, useful for deciding
        what to pull in full next.
      - If a match is too large to return in full, you'll get a short list
        of everything that matched instead (never a silently partial one) —
        call get_instruction on the doc you actually need.

      If nothing is found, proceed using your own judgment.

  get_instruction:
    description: |
      Fetch one instruction document's full body by its docId (from a
      read_instructions result). Use this after read_instructions in
      "short" mode, or after a "too large" response, to pull one specific
      document in full.

  remove_memory:
    description: |
      Delete duplicate or obsolete memories. 
      Do not remove unless confirmed redundant. 
      Prefer updating instead.

resources:
  memory:
    types:
      product:
        description: |
          - Defines WHAT the product does
          - Captures features, flows, and user-facing behavior

      rationale:
        description: |
          - Explains WHY the product or feature exists
          - Includes user problems, goals, and motivations

    relations: ['explains']
